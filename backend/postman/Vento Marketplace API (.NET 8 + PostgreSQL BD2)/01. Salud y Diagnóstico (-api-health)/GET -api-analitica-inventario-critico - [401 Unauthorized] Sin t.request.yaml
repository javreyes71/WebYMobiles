$kind: http-request
name: GET /api/analitica/inventario-critico - [401 Unauthorized] Sin token JWT
description: "Caso negativo 2: Acceso sin credenciales a ruta administrativa protegida."
url: "{{baseUrl}}/api/analitica/inventario-critico"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 3000
