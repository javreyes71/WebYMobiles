$kind: http-request
name: PATCH /api/admin/catalogo/productos/{{createdProductSku}}/moderacion - [400 Bad Request] Rechazo sin motivo obligatorio
description: ""
url: "{{baseUrl}}/api/admin/catalogo/productos/{{createdProductSku}}/moderacion"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: json
  content: |-
    {
      "estadoModeracion": "Rechazado",
      "motivoRechazo": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 4000
