$kind: http-request
name: POST /api/ordenes - [409 Conflict] Stock insuficiente para cantidad solicitada
description: ""
url: "{{baseUrl}}/api/ordenes"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{compradorToken}}
body:
  type: json
  content: |-
    {
      "items": [
        {
          "sku": "VNT-P001",
          "tipo": "Producto",
          "quantity": 99999
        }
      ],
      "direccionDespacho": "Av. Providencia 1234"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 3000
