$kind: http-request
name: PATCH /api/ordenes/{{createdOrderId}}/despacho - [200 OK] Actualizar despacho BD2 (Despachado + Courier)
description: ""
url: "{{baseUrl}}/api/ordenes/{{createdOrderId}}/despacho"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{vendedorToken}}
body:
  type: json
  content: |-
    {
      "estado": "Despachado",
      "courier": "Chilexpress",
      "trackingCodigo": "CHX-99887766"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 6000
