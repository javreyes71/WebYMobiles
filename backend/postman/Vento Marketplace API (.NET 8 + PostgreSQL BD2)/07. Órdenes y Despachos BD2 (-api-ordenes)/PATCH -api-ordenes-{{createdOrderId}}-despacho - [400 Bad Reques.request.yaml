$kind: http-request
name: PATCH /api/ordenes/{{createdOrderId}}/despacho - [400 Bad Request] Estado fuera de chk_despacho_estado_valido
description: ""
url: "{{baseUrl}}/api/ordenes/{{createdOrderId}}/despacho"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{vendedorToken}}
body:
  type: json
  content: |-
    {
      "estado": "PerdidoEnElEspacio"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 7000
