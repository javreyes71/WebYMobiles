$kind: http-request
name: PUT /api/productos/{{createdProductSku}} - [200 OK] Propietario edita producto
description: ""
url: "{{baseUrl}}/api/productos/{{createdProductSku}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{vendedorToken}}
body:
  type: json
  content: |-
    {
      "nombre": "Mochila Urbana Impermeable Pro 25L",
      "precio": 44990,
      "stock": 18,
      "descripcion": "Versión actualizada con cierre YKK impermeable."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 8000
