$kind: http-request
name: POST /api/servicios - [403 Forbidden] Vendedor de Productos intenta publicar un Servicio
description: ""
url: "{{baseUrl}}/api/servicios"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{vendedorToken}}
body:
  type: json
  content: |-
    {
      "nombre": "Servicio cruzado no permitido",
      "categoria": "Consultoría",
      "precio": 50000,
      "descripcion": "Intento bloqueado por separación estricta de dominios."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 403", function () {
          pm.response.to.have.status(403);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 6000
