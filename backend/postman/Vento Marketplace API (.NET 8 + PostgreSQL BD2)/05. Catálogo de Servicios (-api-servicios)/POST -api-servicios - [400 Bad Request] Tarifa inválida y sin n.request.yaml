$kind: http-request
name: POST /api/servicios - [400 Bad Request] Tarifa inválida y sin nombre
description: ""
url: "{{baseUrl}}/api/servicios"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{proveedorToken}}
body:
  type: json
  content: |-
    {
      "nombre": "",
      "precio": -100
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 5000
