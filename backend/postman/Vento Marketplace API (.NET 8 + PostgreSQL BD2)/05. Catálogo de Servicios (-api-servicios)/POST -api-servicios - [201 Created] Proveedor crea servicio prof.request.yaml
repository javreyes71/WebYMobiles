$kind: http-request
name: POST /api/servicios - [201 Created] Proveedor crea servicio profesional (entra Pendiente)
description: ""
url: "{{baseUrl}}/api/servicios"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{proveedorToken}}
body:
  type: json
  content: |-
    {
      "nombre": "Auditoría de Ciberseguridad Web OWASP",
      "marca": "Nexo Digital",
      "categoria": "Tecnología y Soporte",
      "modalidad": "Remoto",
      "cobertura": "Todo Chile",
      "tiempoEstimado": "5 días hábiles",
      "permiteCotizacion": "sí",
      "precio": 180000,
      "descripcion": "Revisión integral de vulnerabilidades OWASP Top 10 con informe ejecutivo y remediación.",
      "incluye": [
        "Escaneo de endpoints",
        "Informe técnico PDF",
        "Sesión de cierre"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
      if (pm.response.code === 201) {
          const json = pm.response.json();
          if (json && json.data && json.data.sku) {
              pm.collectionVariables.set("createdServiceSku", String(json.data.sku));
              pm.environment.set("createdServiceSku", String(json.data.sku));
          }
      }
    language: text/javascript
order: 4000
