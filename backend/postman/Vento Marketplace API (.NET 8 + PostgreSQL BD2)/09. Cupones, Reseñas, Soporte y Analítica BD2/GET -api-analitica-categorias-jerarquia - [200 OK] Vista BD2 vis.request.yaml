$kind: http-request
name: GET /api/analitica/categorias-jerarquia - [200 OK] Vista BD2 vista_categorias_jerarquia
description: Taxonomia y subdivision recursiva de categorias (vista_categorias_jerarquia de PostgreSQL BD2).
url: "{{baseUrl}}/api/analitica/categorias-jerarquia"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Formato JSON estandar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("data");
          pm.expect(json.data).to.be.an("array");
      });
    language: text/javascript
order: 11000
