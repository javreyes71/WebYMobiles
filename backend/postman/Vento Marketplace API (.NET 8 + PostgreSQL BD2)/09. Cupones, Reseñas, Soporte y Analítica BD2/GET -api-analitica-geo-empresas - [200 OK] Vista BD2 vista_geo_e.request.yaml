$kind: http-request
name: GET /api/analitica/geo-empresas - [200 OK] Vista BD2 vista_geo_empresas
description: Cobertura territorial y superficie de comunas de empresas (vista_geo_empresas de PostgreSQL BD2).
url: "{{baseUrl}}/api/analitica/geo-empresas"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Formato JSON estandar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("data");
          pm.expect(json.data).to.be.an("array");
      });
    language: text/javascript
order: 10000
