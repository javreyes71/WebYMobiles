$kind: http-request
name: POST /api/resenas - [400 Bad Request] Calificación fuera de rango 1..5 (chk_resena_calificacion_rango)
description: ""
url: "{{baseUrl}}/api/resenas"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{compradorToken}}
body:
  type: json
  content: |-
    {
      "tipo": "Producto",
      "itemId": "VNT-P001",
      "rating": 9,
      "comentario": "Calificación inválida."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 4000
