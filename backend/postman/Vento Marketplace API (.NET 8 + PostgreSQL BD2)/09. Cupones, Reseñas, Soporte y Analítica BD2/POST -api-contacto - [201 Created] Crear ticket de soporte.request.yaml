$kind: http-request
name: POST /api/contacto - [201 Created] Crear ticket de soporte
description: ""
url: "{{baseUrl}}/api/contacto"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Visitante Demo",
      "correo": "visitante@correo.cl",
      "asunto": "Consulta sobre envíos a regiones",
      "mensaje": "Hola, quisiera confirmar cobertura hacia la Región de Los Lagos."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 5000
