$kind: http-request
name: POST /api/resenas - [201 Created] Publicar reseña en tablas BD2 (reseña + reseñar)
description: ""
url: "{{baseUrl}}/api/resenas"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{compradorToken}}
body:
  type: json
  content: |-
    {
      "tipo": "Producto",
      "itemId": "VNT-P001",
      "rating": 5,
      "comentario": "Excelente calidad de terminaciones y despacho puntual."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 3000
