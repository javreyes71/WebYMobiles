$kind: http-request
name: GET /api/auth/me - [200 OK] Perfil autenticado actual
description: ""
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{compradorToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 10000
