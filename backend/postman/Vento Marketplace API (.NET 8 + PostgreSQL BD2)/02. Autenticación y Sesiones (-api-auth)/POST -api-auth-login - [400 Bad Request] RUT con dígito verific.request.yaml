$kind: http-request
name: POST /api/auth/login - [400 Bad Request] RUT con dígito verificador Módulo 11 inválido
description: "Caso negativo 1: Doble validación en C# rechaza RUT inválido antes de llegar a PostgreSQL."
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rut": "12.345.678-0",
      "password": "Admin123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 5000
