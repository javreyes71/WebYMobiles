$kind: http-request
name: POST /api/auth/login - [401 Unauthorized] Contraseña incorrecta
description: "Caso negativo 2: Credenciales inválidas devuelven 401 sin filtrar detalles internos."
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rut": "12.345.678-5",
      "password": "ClaveIncorrecta999!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 6000
