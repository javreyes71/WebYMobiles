$kind: http-request
name: POST /api/auth/register - [201 Created] Registro nuevo Comprador válido
description: Registra un usuario nuevo validando RUT Módulo 11 y correo electrónico.
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Valentina Soto",
      "rut": "17.654.321-3",
      "correo": "valentina.postman@vento.cl",
      "telefono": "+56987654321",
      "direccion": "Av. Providencia 1550, Providencia",
      "fechaNacimiento": "1997-04-18",
      "password": "User1234!",
      "confirmPassword": "User1234!",
      "tipoCuenta": "Comprador"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
      if (pm.response.code === 201) {
          const json = pm.response.json();
          if (json && json.data && json.data.id) {
              pm.collectionVariables.set("createdUserId", String(json.data.id));
              pm.environment.set("createdUserId", String(json.data.id));
          }
      }
    language: text/javascript
order: 7000
