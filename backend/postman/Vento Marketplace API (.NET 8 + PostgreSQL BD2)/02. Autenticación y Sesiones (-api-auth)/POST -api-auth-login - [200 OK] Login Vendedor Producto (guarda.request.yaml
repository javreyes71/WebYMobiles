$kind: http-request
name: POST /api/auth/login - [200 OK] Login Vendedor Producto (guarda {{vendedorToken}})
description: Autentica al Vendedor de Productos aprobado y almacena su JWT en {{vendedorToken}}.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rut": "16.234.567-2",
      "password": "vento1234"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
      if (pm.response.code === 200) {
          const json = pm.response.json();
          if (json && json.data && json.data.token) {
              pm.collectionVariables.set("vendedorToken", json.data.token);
              pm.environment.set("vendedorToken", json.data.token);
          }
      }
    language: text/javascript
order: 2000
