$kind: http-request
name: POST /api/cotizaciones - [404 Not Found] Servicio inexistente
description: ""
url: "{{baseUrl}}/api/cotizaciones"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{compradorToken}}
body:
  type: json
  content: |-
    {
      "servicioId": "SRV-FANTASMA",
      "detalles": "Solicitud sobre un servicio que no existe en la base de datos."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 3000
