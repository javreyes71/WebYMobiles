$kind: http-request
name: PATCH /api/cotizaciones/{{createdQuoteId}}/propuesta - [200 OK] Proveedor envía propuesta económica formal
description: ""
url: "{{baseUrl}}/api/cotizaciones/{{createdQuoteId}}/propuesta"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{proveedorToken}}
body:
  type: json
  content: |-
    {
      "monto": 240000,
      "plazo": "7 días hábiles",
      "validezDias": 10,
      "detalle": "Incluye diseño UX/UI en Figma, desarrollo responsive y capacitación."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 4000
