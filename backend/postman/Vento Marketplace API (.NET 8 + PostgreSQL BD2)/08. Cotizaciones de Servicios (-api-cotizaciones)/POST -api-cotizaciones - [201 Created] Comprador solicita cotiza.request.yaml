$kind: http-request
name: POST /api/cotizaciones - [201 Created] Comprador solicita cotización de servicio
description: ""
url: "{{baseUrl}}/api/cotizaciones"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{compradorToken}}
body:
  type: json
  content: |-
    {
      "servicioId": "VNT-S001",
      "nombreContacto": "Camila Rojas",
      "correoContacto": "camila@cliente.cl",
      "telefonoContacto": "+56991234567",
      "fechaDeseada": "2026-11-20",
      "modalidadPreferida": "Remoto",
      "detalles": "Necesitamos rediseñar nuestro e-commerce corporativo con catálogo de 80 SKU."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
      if (pm.response.code === 201) {
          const json = pm.response.json();
          if (json && json.data && json.data.id) {
              pm.collectionVariables.set("createdQuoteId", String(json.data.id));
              pm.environment.set("createdQuoteId", String(json.data.id));
          }
      }
    language: text/javascript
order: 1000
