$kind: http-request
name: PUT /api/usuarios/12345678-5 - [403 Forbidden] Comprador intenta editar perfil de otro usuario
description: ""
url: "{{baseUrl}}/api/usuarios/12345678-5"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{compradorToken}}
body:
  type: json
  content: |-
    {
      "nombre": "Intento Suplantación"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 403", function () {
          pm.response.to.have.status(403);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", false);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 6000
