$kind: http-request
name: PATCH /api/admin/usuarios/19876543-0/aprobacion - [200 OK] Admin aprueba cuenta comercial pendiente
description: ""
url: "{{baseUrl}}/api/admin/usuarios/19876543-0/aprobacion"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: json
  content: |-
    {
      "decision": "Aprobado",
      "verificado": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP Status esperado: 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Formato JSON estándar { success, message, data, errors }", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.be.an("array");
      });
    language: text/javascript
order: 8000
